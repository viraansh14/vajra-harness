[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-sync"
version = "0.1.0"
description = "Shared memory sync between winpc-claude and mac-claude"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
memory-sync = "memory_sync.cli:main"

[tool.setuptools]
packages = ["memory_sync"]
